    <div class="speed-bar">

      <button class="speed-btn" onclick="setSpeed(3000)" id="spd3">3초</button>

    <!-- 이전 / 재생 / 다음 컨트롤 -->
    <div class="nav-grid">
      <button class="nav-btn" onclick="prevWord()">◀ 이전</button>
      <button class="nav-btn play-btn" onclick="togglePlay()" id="playBtn">⏸ 일시정지</button>
      <button class="nav-btn" onclick="nextWord()">다음 ▶</button>

    let currentIndex = 0;
    let autoIntervalMs = 2000;
    let isPlaying = true;
    let timer = null;

    function renderWord() {
      const item = WORDS[currentIndex];
      if (!item) return;

      document.getElementById('counter').innerText = '단어 ' + (currentIndex + 1) + ' / ' + WORDS.length;
      document.getElementById('gradeBadge').innerText = item.grade === 'idiom' ? '중학 숙어' : '중' + item.grade;
      document.getElementById('categoryBadge').innerText = item.category || '어휘';
      document.getElementById('wordText').innerText = item.word;
      document.getElementById('phoneticText').innerText = item.phonetic || '';
      document.getElementById('meaningText').innerText = item.meaning;
      document.getElementById('exampleEn').innerText = item.exampleEn || '';
      document.getElementById('exampleKo').innerText = item.exampleKo || '';

      speak(item.word);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      }
    }

    function resetTimer() {
      if (timer) clearInterval(timer);
      if (isPlaying) {
        timer = setInterval(() => {
          currentIndex = (currentIndex + 1) % WORDS.length;
          renderWord();
        }, autoIntervalMs);
      }
    }

    function nextWord() {
      currentIndex = (currentIndex + 1) % WORDS.length;
      renderWord();
      if (isPlaying) resetTimer();
    }

    function prevWord() {
      currentIndex = (currentIndex - 1 + WORDS.length) % WORDS.length;
      renderWord();
      if (isPlaying) resetTimer();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');
      if (isPlaying) {
        btn.innerText = '⏸ 일시정지';
        btn.classList.remove('paused');
        resetTimer();
      } else {
        btn.innerText = '▶ 자동재생';
        btn.classList.add('paused');
        if (timer) clearInterval(timer);
      }
    }

    function setSpeed(ms) {
      autoIntervalMs = ms;
      document.getElementById('spd1').classList.toggle('active', ms === 1000);
      document.getElementById('spd2').classList.toggle('active', ms === 2000);
      document.getElementById('spd3').classList.toggle('active', ms === 3000);
      if (isPlaying) resetTimer();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextWord();
      else if (e.key === 'ArrowLeft') prevWord();
      else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    });

    renderWord();
    resetTimer();
  </script>
